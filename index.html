  <style>
    :root{--bg:#f7f7f8;--card:#fff;--muted:#666;--accent:#0064e0}
    body{font-family:Inter, Roboto, Arial, sans-serif;background:var(--bg);margin:0;padding:40px;color:#111}
    h1{margin:0 0 12px;font-size:1.6rem}
    .intro{margin-bottom:22px}
    .intro p{margin:6px 0}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
    .card{background:var(--card);border-radius:12px;padding:12px;box-shadow:0 6px 18px rgba(10,10,10,0.06);display:flex;flex-direction:column;align-items:center;text-align:center;text-decoration:none;color:inherit;transition:transform .15s, box-shadow .15s}
    .card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(10,10,10,0.10)}
    .card img{width:100%;height:180px;object-fit:cover;display:block;border-radius:8px}
    .title{font-size:0.95rem;margin:16px 6px 6px;color:#111}
    .note{font-size:0.8rem;color:var(--muted)}

    /* Hervorgehobene Quest-Karte */
    .hero{grid-column:1 / -1;flex-direction:row;gap:20px;text-align:left;border:2px solid var(--accent);margin-bottom:6px}
    .hero img{width:280px;flex-shrink:0}
    .hero .title{font-size:1.3rem;font-weight:700;margin:0 0 6px}
    .hero .cta{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;border-radius:8px;padding:8px 14px;font-weight:600}

    @media (max-width:600px){
      .hero{flex-direction:column;text-align:center}
      .hero img{width:100%}
    }
    /* Suchfeld */
    body{position:relative}
    .intro{padding-right:56px}
    .suchbox{position:absolute;top:32px;right:32px;display:flex;align-items:center;background:#fff;border:1px solid #d4d4d8;border-radius:999px;box-shadow:0 4px 12px rgba(10,10,10,0.06);transition:border-color .2s}
    .suchbox.offen{border-color:var(--accent)}
    .lupe{width:42px;height:42px;border:0;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#333;padding:0;flex-shrink:0}
    .lupe svg{width:20px;height:20px}
    .search{width:0;padding:0;border:0;outline:none;background:none;font:inherit;font-size:1rem;transition:width .25s, padding .25s}
    .suchbox.offen .search{width:min(220px, 55vw);padding:0 4px 0 16px}
    .search::-webkit-search-cancel-button{cursor:pointer}
    .empty{grid-column:1 / -1;color:var(--muted);text-align:center;padding:20px}
    .hidden{display:none}

    @media (max-width:420px){body{padding:16px}.card img{height:140px}.suchbox{top:12px;right:12px}}
  </style>
</head>
<body>

  <!-- Standardtext Englisch (sehen auch Reddit & Co.), wird bei deutschem Browser umgeschaltet -->
  <div class="intro">
    <h1 data-en="Meta Quest Referral Links" data-de="Meta Quest Referral-Links">Meta Quest Referral Links</h1>
    <p data-en="Click a game to open it in the Meta Store and get 15% off."
       data-de="Klicke auf ein Spiel, um es im Meta-Store zu öffnen und 15% Rabatt zu bekommen.">
      Click a game to open it in the Meta Store and get 15% off.</p>
    <p data-en='&lt;b&gt;&lt;u&gt;We may need to be connected first:&lt;/u&gt;&lt;/b&gt; &lt;a href="https://horizon.meta.com/profile/109926180860502/?hwsh=6SyOU5BrL4" target="_blank" rel="noopener noreferrer"&gt;&lt;b&gt;click here for my profile&lt;/b&gt;&lt;/a&gt;'
       data-de='&lt;b&gt;&lt;u&gt;Eventuell müssen wir zuerst connected sein,&lt;/u&gt;&lt;/b&gt; &lt;a href="https://horizon.meta.com/profile/109926180860502/?hwsh=6SyOU5BrL4" target="_blank" rel="noopener noreferrer"&gt;&lt;b&gt;klicke dafür hier!&lt;/b&gt;&lt;/a&gt;'>
      <b><u>We may need to be connected first:</u></b>
      <a href="https://horizon.meta.com/profile/109926180860502/?hwsh=6SyOU5BrL4" target="_blank" rel="noopener noreferrer"><b>click here for my profile</b></a></p>
  </div>

  <div class="suchbox" id="suchbox">
    <input type="search" id="suche" class="search" placeholder="Search games…" aria-label="Search games" autocomplete="off">
    <button class="lupe" id="lupe" type="button" aria-label="Search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    </button>
  </div>

  <div class="grid" id="grid">

    <a class="card hero" href="https://www.meta.com/referrals/link/Spark633/" target="_blank" rel="sponsored nofollow noopener noreferrer">
      <img src="https://i.imgur.com/ckBouJs.png" alt="Meta Quest">
      <div>
        <div class="title" data-en="€30 with a new Quest" data-de="30€ bei neuer Quest">€30 with a new Quest</div>
        <div class="note" data-en="Use before activation" data-de="Vor der Aktivierung nutzen">Use before activation</div>
        <span class="cta" data-en="Get the headset link" data-de="Zum Headset-Link">Get the headset link</span>
      </div>
    </a>

    <!-- Die Spiele-Karten werden automatisch aus der SPIELE-Liste oben erzeugt -->
  </div>

  <script>
    const lang = (navigator.language || "en").substring(0, 2) === "de" ? "de" : "en";
    const PC_HINWEIS = { en: "PC-VR", de: "PC-VR" };
    const BASIS = "https://www.meta.com/appreferrals/Spark633/";
    const UTM = "?utm_source=oculus&utm_location=2&utm_parent=frl&utm_medium=app_referral&utm_content=copy";

    // Karten aus der Liste bauen
    const grid = document.getElementById("grid");
    SPIELE.forEach(([name, nummer, bild, extra]) => {
      const a = document.createElement("a");
      a.className = "card";
      a.href = BASIS + nummer + UTM;
      a.target = "_blank";
      a.rel = "sponsored nofollow noopener noreferrer";

      const img = document.createElement("img");
      img.src = bild;
      img.alt = name;
      img.loading = "lazy";

      const titel = document.createElement("div");
      titel.className = "title";
      titel.textContent = name;

      a.append(img, titel);

      if (extra === "pc") {
        const hinweis = document.createElement("div");
        hinweis.className = "note";
        hinweis.textContent = PC_HINWEIS[lang];
        a.append(hinweis);
      }
      grid.append(a);
    });

    // Suche: filtert die Spiele-Karten nach Namen
    const suche = document.getElementById("suche");
    const hero = grid.querySelector(".hero");
    const spielKarten = [...grid.querySelectorAll(".card:not(.hero)")];
    const leer = document.createElement("div");
    leer.className = "empty hidden";
    leer.textContent = lang === "de" ? "Kein Spiel gefunden." : "No game found.";
    grid.append(leer);
    if (lang === "de") { suche.placeholder = "Spiel suchen…"; suche.setAttribute("aria-label", "Spiel suchen"); }

    // Lupe: klappt das Suchfeld auf und zu
    const suchbox = document.getElementById("suchbox");
    const lupe = document.getElementById("lupe");
    if (lang === "de") lupe.setAttribute("aria-label", "Suche");
    lupe.addEventListener("mousedown", e => e.preventDefault()); // verhindert, dass das Feld beim Klick erst zuklappt
    lupe.addEventListener("click", () => {
      const offen = suchbox.classList.toggle("offen");
      if (offen) { suche.focus(); }
      else { suche.value = ""; suche.dispatchEvent(new Event("input")); }
    });
    suche.addEventListener("keydown", e => {
      if (e.key === "Escape") { suche.value = ""; suche.dispatchEvent(new Event("input")); suchbox.classList.remove("offen"); }
    });
    suche.addEventListener("blur", () => { if (!suche.value) suchbox.classList.remove("offen"); });

    suche.addEventListener("input", () => {
      const q = suche.value.trim().toLowerCase();
      let treffer = 0;
      spielKarten.forEach(karte => {
        const passt = karte.querySelector(".title").textContent.toLowerCase().includes(q);
        karte.classList.toggle("hidden", !passt);
        if (passt) treffer++;
      });
      hero.classList.toggle("hidden", q !== "");   // Quest-Karte beim Suchen ausblenden
      leer.classList.toggle("hidden", treffer > 0);
    });

    // Feste Texte auf Deutsch umschalten
    if (lang === "de") {
      document.documentElement.lang = "de";
      document.title = "Meta Quest Referral-Links";
      document.querySelectorAll("[data-de]").forEach(el => { el.innerHTML = el.dataset.de; });
    }
  </script>
</body>
